<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sabor de Pastel – Pedidos e Vendas</title>
<style>
:root{--bg:#f6f5f0;--card:#fff;--ink:#141414;--muted:#6b6b66;--brand:#141414;--y:#ffc914;--y-soft:#fff6cc;--brand-2:#ffc914;--ok:#2b8a3e;--line:#e4e1d6;--danger:#c92a2a}
*{box-sizing:border-box}
html{color-scheme:light}
button,input,select,textarea{font-family:inherit}
.qty button,.pay button,.chip,.btn.sec{color:var(--ink)}
.chip.on,.pay button.on{color:var(--y)}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
header{background:#141414;color:#fff;border-bottom:4px solid var(--y);padding:14px 16px 10px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:21px;letter-spacing:.3px;color:var(--y);font-weight:800}
header small{opacity:.9}
nav{display:flex;gap:4px;margin-top:10px;overflow-x:auto}
nav button{flex:1;min-width:84px;border:0;border-radius:10px 10px 0 0;padding:10px 6px;font-size:14px;font-weight:600;background:rgba(255,255,255,.1);color:#fff;cursor:pointer}
nav button.on{background:var(--y);color:#141414}
main{max-width:720px;margin:0 auto;padding:14px 14px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:17px;margin:4px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.prod{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.prod .n{font-weight:600}
.prod .p{color:var(--muted);font-size:14px}
.qty{display:flex;align-items:center;justify-content:space-between;gap:6px}
.qty button{width:44px;height:44px;border-radius:10px;border:1px solid #e9d27a;background:var(--y-soft);font-size:24px;font-weight:700;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.qty b{font-size:18px;min-width:24px;text-align:center}
.prod.sel{border-color:var(--y);box-shadow:0 0 0 2px var(--y) inset;background:#fffdf3}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff;color:var(--ink)}
.row{display:flex;gap:8px}
.row>*{flex:1}
.pay{display:flex;gap:6px}
.pay button{flex:1;padding:11px 4px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:15px;cursor:pointer}
.pay button.on{background:#141414;color:var(--y);border-color:#141414;font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;z-index:6}
.bar .tot{flex:1}
.bar .tot small{color:var(--muted);display:block}
.bar .tot b{font-size:22px}
.bar{border-top:3px solid var(--y)!important}
.btn{border:0;border-radius:12px;padding:13px 18px;font-size:16px;font-weight:700;cursor:pointer;background:var(--y);color:#141414}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:14px;font-weight:600}
.btn:disabled{opacity:.4}
.order{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
.order .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:12px;font-weight:700;padding:4px 8px;border-radius:20px;white-space:nowrap}
.t-prep{background:#fff3bf;color:#8a5a00}.t-ok{background:#d3f9d8;color:var(--ok)}.t-can{background:#ffe3e3;color:var(--danger)}
.muted{color:var(--muted);font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:#fff;border-left:5px solid var(--y)!important;border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi small{color:var(--muted)}
.kpi b{display:block;font-size:22px;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
td.r,th.r{text-align:right}
.barline{height:8px;background:var(--y-soft);border-radius:6px;overflow:hidden;margin-top:4px}
.barline i{display:block;height:100%;background:var(--brand-2)}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#141414;color:var(--y);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20;display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:15}
.modal .box{background:#fff;width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:16px}
.hidden{display:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:14px;cursor:pointer}
.chip.on{background:#141414;color:var(--y);border-color:#141414}
.mrow{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--line);cursor:pointer;background:#fff}
.mrow:last-child{border-bottom:0}
.mrow:active{background:var(--y-soft)}
.mrow .info{flex:1;min-width:0}
.mrow .nm{font-weight:600;font-size:16px}
.mrow .pr{color:var(--muted);font-size:14px;margin-top:2px}
.mrow.off .nm,.mrow.off .pr{opacity:.45}
.mgroup{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px}
.sw{position:relative;width:46px;height:28px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#d9cfc2;border-radius:20px;transition:.2s}
.sw span:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw input:checked+span{background:var(--y)}
.sw input:checked+span:before{transform:translateX(18px)}
.sw-lbl{font-size:11px;color:var(--muted);text-align:center;margin-top:2px}
.cat{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:14px 2px 8px}
</style>
</head>
<body>
<header>
  <h1>🥟 Sabor de Pastel</h1>
  <small id="hoje"></small>
  <nav>
    <button data-t="novo" class="on">Novo pedido</button>
    <button data-t="pedidos">Pedidos</button>
    <button data-t="resumo">Resumo</button>
    <button data-t="cardapio">Cardápio</button>
  </nav>
</header>

<main>
  <!-- NOVO PEDIDO -->
  <section id="v-novo">
    <div id="lista-prod"></div>
    <div class="card">
      <div class="row">
        <div><label>Cliente (opcional)</label><input id="cli" placeholder="Nome ou mesa"></div>
        <div><label>Tipo</label><select id="tipo"><option>Balcão</option><option>Retirada</option><option>Entrega</option></select></div>
      </div>
      <label>Forma de pagamento</label>
      <div class="pay" id="pay">
        <button data-p="Dinheiro">Dinheiro</button><button data-p="Pix" class="on">Pix</button><button data-p="Cartão">Cartão</button>
      </div>
      <label>Observação</label>
      <input id="obs" placeholder="Ex.: sem cebola, bem passado">
    </div>
  </section>

  <!-- PEDIDOS -->
  <section id="v-pedidos" class="hidden">
    <div class="chips" id="filtro" style="margin-bottom:12px">
      <button class="chip on" data-f="todos">Todos</button>
      <button class="chip" data-f="prep">Em preparo</button>
      <button class="chip" data-f="ok">Entregues</button>
    </div>
    <div id="lista-ped"></div>
  </section>

  <!-- RESUMO -->
  <section id="v-resumo" class="hidden">
    <div class="card"><label style="margin-top:0">Dia</label><input type="date" id="dia"></div>
    <div class="kpis" id="kpis"></div>
    <div class="card" style="margin-top:12px"><h2>Por forma de pagamento</h2><table id="t-pag"></table></div>
    <div class="card"><h2>Mais vendidos</h2><div id="t-itens"></div><p class="muted">Use esta lista para planejar a compra de recheios e massa do próximo dia.</p></div>
    <div class="card"><h2>Exportar vendas</h2><p class="muted">Gera um texto (CSV) com os pedidos do dia para guardar no computador ou em uma planilha.</p><button class="btn sec sm" id="exp">Copiar vendas do dia</button><textarea id="csv" rows="5" class="hidden" style="margin-top:10px"></textarea></div>
  </section>

  <!-- CARDÁPIO -->
  <section id="v-cardapio" class="hidden">
    <div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:10px">
      <div><h2 style="margin:0">Cardápio</h2><div class="muted">Toque em um item para editar</div></div>
      <button class="btn sm" id="novo-item">+ Novo item</button>
    </div>
    <div id="lista-card"></div>
  </section>
</main>

<div class="bar" id="barra">
  <div class="tot"><small id="qtd-itens">Nenhum item</small><b id="total">R$ 0,00</b></div>
  <button class="btn sec sm" id="limpar">Limpar</button>
  <button class="btn" id="registrar" disabled>Registrar</button>
</div>

<div class="modal" id="modal"><div class="box" id="modal-box"></div></div>
<div class="toast" id="toast"></div>

<script>
const KEY="saborDePastel.v6";
const fmt=v=>v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const hojeISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const exemplo=[
 ["Pastel de Carne","Pastéis"],["Pastel de Queijo","Pastéis"],["Pastel de Pizza","Pastéis"],["Pastel de Carne e Queijo","Pastéis"],["Pastel de Frango com Catupiry","Pastéis"],
 ["Caldo de Cana","Bebidas"],["Refrigerante Lata","Bebidas"],["Suco Natural","Bebidas"]
];
let db;
function load(){
  try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){db=null}
  if(!db){db={produtos:exemplo.map(([n,c])=>c==="Pastéis"?{id:uid(),nome:n,cat:c,precoM:15,precoG:25,ativo:true}:{id:uid(),nome:n,cat:c,preco:10,ativo:true}),pedidos:[],seq:0}}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
load();

let carrinho={}, pag="Pix", filtro="todos";
const temTam=p=>p.cat==="Pastéis";
const semPrecoP=p=>temTam(p)?(!p.precoM||!p.precoG):!p.preco;
const numBR=t=>{const v=parseFloat(String(t).replace(/\./g,"").replace(",","."));return isNaN(v)?0:v};
const cap=t=>t.trim().toLowerCase().split(/\s+/).map((w,i)=>i>0&&["de","da","do","das","dos","e","com"].includes(w)?w:w.charAt(0).toUpperCase()+w.slice(1)).join(" ");
const valBR=v=>v?v.toFixed(2).replace(".",","):"";
const $=id=>document.getElementById(id);
$("hoje").textContent=new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long"});
$("dia").value=hojeISO();

function toast(t){const el=$("toast");el.textContent=t;el.style.display="block";clearTimeout(el._t);el._t=setTimeout(()=>el.style.display="none",1800)}

// navegação
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>aba(b.dataset.t));
function aba(t){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  ["novo","pedidos","resumo","cardapio"].forEach(v=>$("v-"+v).classList.toggle("hidden",v!==t));
  $("barra").style.display=t==="novo"?"flex":"none";
  ({novo:renderNovo,pedidos:renderPedidos,resumo:renderResumo,cardapio:renderCardapio})[t]();
  window.scrollTo(0,0);
}

// NOVO PEDIDO
function renderNovo(){
  const ativos=db.produtos.filter(p=>p.ativo);
  if(!ativos.length){$("lista-prod").innerHTML='<div class="empty">Nenhum item ativo. Cadastre na aba Cardápio.</div>';return}
  const semPreco=ativos.some(semPrecoP);
  let h=semPreco?'<div class="card muted">⚠️ Alguns itens estão sem preço. Defina os preços na aba <b>Cardápio</b>.</div>':"";
  ["Pastéis","Bebidas","Outros"].forEach(cat=>{
    const ps=ativos.filter(p=>p.cat===cat);if(!ps.length)return;
    h+=`<div class="cat">${cat}</div><div class="grid">`+ps.map(p=>{
      if(temTam(p)){const qm=carrinho[p.id+"|M"]||0,qg=carrinho[p.id+"|G"]||0;
        return `<div class="prod ${qm||qg?"sel":""}"><div class="n">${esc(p.nome)}</div>
        <div class="p">M · ${fmt(p.precoM||0)}</div><div class="qty"><button data-m="${p.id}|M" aria-label="Diminuir">-</button><b>${qm}</b><button data-a="${p.id}|M">+</button></div>
        <div class="p">G · ${fmt(p.precoG||0)}</div><div class="qty"><button data-m="${p.id}|G" aria-label="Diminuir">-</button><b>${qg}</b><button data-a="${p.id}|G">+</button></div></div>`}
      const q=carrinho[p.id]||0;
      return `<div class="prod ${q?"sel":""}"><div class="n">${esc(p.nome)}</div><div class="p">${fmt(p.preco||0)}</div>
      <div class="qty"><button data-m="${p.id}" aria-label="Diminuir">-</button><b>${q}</b><button data-a="${p.id}">+</button></div></div>`}).join("")+"</div>";
  });
  $("lista-prod").innerHTML=h;
  $("lista-prod").querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{carrinho[b.dataset.a]=(carrinho[b.dataset.a]||0)+1;renderNovo()});
  $("lista-prod").querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{const k=b.dataset.m;if(carrinho[k]>1)carrinho[k]--;else delete carrinho[k];renderNovo()});
  atualizaBarra();
}
function itensCarrinho(){return Object.entries(carrinho).map(([k,q])=>{const [id,t]=k.split("|");const p=db.produtos.find(x=>x.id===id);if(!p)return null;
  return t?{nome:p.nome+" ("+t+")",preco:(t==="M"?p.precoM:p.precoG)||0,qtd:q}:{nome:p.nome,preco:p.preco||0,qtd:q}}).filter(Boolean)}
function atualizaBarra(){
  const it=itensCarrinho();const n=it.reduce((a,b)=>a+b.qtd,0);const t=it.reduce((a,b)=>a+b.qtd*b.preco,0);
  $("qtd-itens").textContent=n?n+(n>1?" itens":" item"):"Nenhum item";$("total").textContent=fmt(t);$("registrar").disabled=!n;
}
$("limpar").onclick=()=>{carrinho={};$("cli").value="";$("obs").value="";renderNovo()};
const FORMAS=[["Dinheiro"],["Pix"],["Cartão"]];
$("pay").querySelectorAll("button").forEach(b=>b.onclick=()=>{pag=b.dataset.p;$("pay").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b))});
$("registrar").onclick=()=>registrarPedido();
function registrarPedido(){
  const it=itensCarrinho();if(!it.length||!pag)return;
  db.seq=(db.seq||0)+1;
  db.pedidos.push({id:uid(),num:db.seq,dia:hojeISO(),hora:new Date().toTimeString().slice(0,5),cliente:$("cli").value.trim(),tipo:$("tipo").value,
    pag,obs:$("obs").value.trim(),itens:it,total:it.reduce((a,b)=>a+b.qtd*b.preco,0),status:"prep"});
  save();toast("Pedido nº "+db.seq+" registrado · "+pag);carrinho={};$("cli").value="";$("obs").value="";renderNovo();
}

// PEDIDOS
$("filtro").querySelectorAll(".chip").forEach(c=>c.onclick=()=>{filtro=c.dataset.f;$("filtro").querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===c));renderPedidos()});
function renderPedidos(){
  let ps=db.pedidos.filter(p=>p.dia===hojeISO()).slice().reverse();
  if(filtro!=="todos")ps=ps.filter(p=>p.status===filtro);
  if(!ps.length){$("lista-ped").innerHTML='<div class="empty">Nenhum pedido hoje'+(filtro!=="todos"?" com esse filtro":"")+'.</div>';return}
  const tag={prep:'<span class="tag t-prep">Em preparo</span>',ok:'<span class="tag t-ok">Entregue</span>',can:'<span class="tag t-can">Cancelado</span>'};
  $("lista-ped").innerHTML=ps.map(p=>`<div class="order">
    <div class="top"><b>Nº ${p.num} · ${p.hora}</b>${tag[p.status]}</div>
    <div class="muted">${esc(p.cliente||"Sem nome")} · ${p.tipo} · ${p.pag}</div>
    <div style="margin:8px 0">${p.itens.map(i=>`${i.qtd}× ${esc(i.nome)}`).join("<br>")}</div>
    ${p.obs?`<div class="muted">Obs.: ${esc(p.obs)}</div>`:""}
    <div class="top" style="margin-top:8px"><b>${fmt(p.total)}</b>
      <span>${p.status==="prep"?`<button class="btn sm" data-ok="${p.id}">Entregue</button> `:""}${p.status!=="can"?`<button class="btn sec sm" data-c="${p.id}">Cancelar</button>`:""}</span></div>
  </div>`).join("");
  $("lista-ped").querySelectorAll("[data-ok]").forEach(b=>b.onclick=()=>{db.pedidos.find(p=>p.id===b.dataset.ok).status="ok";save();renderPedidos()});
  $("lista-ped").querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>confirmar("Cancelar este pedido? Ele deixa de contar nas vendas.",()=>{db.pedidos.find(p=>p.id===b.dataset.c).status="can";save();renderPedidos()}));
}

// RESUMO
$("dia").onchange=renderResumo;
function renderResumo(){
  const d=$("dia").value||hojeISO();
  const ps=db.pedidos.filter(p=>p.dia===d&&p.status!=="can");
  const tot=ps.reduce((a,b)=>a+b.total,0);
  const canc=db.pedidos.filter(p=>p.dia===d&&p.status==="can").length;
  const pastel=ps.reduce((a,p)=>a+p.itens.filter(i=>/pastel/i.test(i.nome)).reduce((x,i)=>x+i.qtd,0),0);
  $("kpis").innerHTML=`<div class="kpi"><small>Total vendido</small><b>${fmt(tot)}</b></div>
   <div class="kpi"><small>Pedidos</small><b>${ps.length}</b></div>
   <div class="kpi"><small>Ticket médio</small><b>${fmt(ps.length?tot/ps.length:0)}</b></div>
   <div class="kpi"><small>Pastéis vendidos</small><b>${pastel}</b></div>`+(canc?`<div class="kpi" style="grid-column:1/-1"><small>Pedidos cancelados (não somados)</small><b>${canc}</b></div>`:"");
  const pg={};ps.forEach(p=>{pg[p.pag]=(pg[p.pag]||0)+p.total});
  const qn={};ps.forEach(p=>{qn[p.pag]=(qn[p.pag]||0)+1});
  $("t-pag").innerHTML='<tr><th>Forma</th><th class="r">Pedidos</th><th class="r">Valor</th></tr>'+FORMAS.map(([f])=>`<tr><td>${f}</td><td class="r">${qn[f]||0}</td><td class="r">${fmt(pg[f]||0)}</td></tr>`).join("")+`<tr><td><b>Total</b></td><td class="r"><b>${ps.length}</b></td><td class="r"><b>${fmt(tot)}</b></td></tr>`;
  const it={};ps.forEach(p=>p.itens.forEach(i=>{it[i.nome]=(it[i.nome]||0)+i.qtd}));
  const arr=Object.entries(it).sort((a,b)=>b[1]-a[1]);const mx=arr.length?arr[0][1]:1;
  $("t-itens").innerHTML=arr.length?arr.map(([n,q])=>`<div style="margin-bottom:10px"><div class="top" style="display:flex;justify-content:space-between"><span>${esc(n)}</span><b>${q}</b></div><div class="barline"><i style="width:${q/mx*100}%"></i></div></div>`).join(""):'<p class="muted">Sem vendas neste dia.</p>';
  $("csv").classList.add("hidden");
}
$("exp").onclick=async()=>{
  const d=$("dia").value||hojeISO();
  const linhas=[["pedido","data","hora","cliente","tipo","pagamento","status","itens","total"].join(";")];
  db.pedidos.filter(p=>p.dia===d).forEach(p=>linhas.push([p.num,p.dia,p.hora,p.cliente,p.tipo,p.pag,{prep:"em preparo",ok:"entregue",can:"cancelado"}[p.status],p.itens.map(i=>i.qtd+"x "+i.nome).join(" + "),p.total.toFixed(2).replace(".",",")].map(v=>String(v).replace(/;/g,",")).join(";")));
  const txt=linhas.join("\n");const ta=$("csv");ta.value=txt;ta.classList.remove("hidden");
  try{await navigator.clipboard.writeText(txt);toast("Vendas copiadas")}catch(e){ta.select();toast("Selecione e copie o texto")}
};

// CARDÁPIO
function precoTxt(p){return temTam(p)?`M ${fmt(p.precoM||0)} · G ${fmt(p.precoG||0)}`:fmt(p.preco||0)}
function renderCardapio(){
  if(!db.produtos.length){$("lista-card").innerHTML='<div class="empty">Nenhum item cadastrado. Toque em <b>+ Novo item</b>.</div>';return}
  let h="";
  ["Pastéis","Bebidas","Outros"].forEach(cat=>{
    const ps=db.produtos.filter(p=>p.cat===cat);if(!ps.length)return;
    h+=`<div class="cat">${cat} (${ps.length})</div><div class="mgroup">`+ps.map(p=>`<div class="mrow ${p.ativo?"":"off"}" data-ed="${p.id}">
      <div class="info"><div class="nm">${esc(p.nome)}</div><div class="pr">${precoTxt(p)}${semPrecoP(p)?' · <span style="color:var(--danger)">sem preço</span>':""}</div></div>
      <div><label class="sw" onclick="event.stopPropagation()"><input type="checkbox" data-at="${p.id}" ${p.ativo?"checked":""}><span></span></label><div class="sw-lbl">${p.ativo?"Disponível":"Esgotado"}</div></div>
    </div>`).join("")+"</div>";
  });
  $("lista-card").innerHTML=h;
  $("lista-card").querySelectorAll("[data-ed]").forEach(r=>r.onclick=()=>editarItem(r.dataset.ed));
  $("lista-card").querySelectorAll("[data-at]").forEach(i=>i.onchange=()=>{db.produtos.find(x=>x.id===i.dataset.at).ativo=i.checked;save();renderCardapio()});
}
$("novo-item").onclick=()=>editarItem(null);
function editarItem(id){
  const p=id?db.produtos.find(x=>x.id===id):{nome:"",cat:"Pastéis",precoM:15,precoG:25,preco:0,ativo:true};
  $("modal-box").innerHTML=`<h2 style="margin-top:0">${id?"Editar item":"Novo item"}</h2>
    <label>Nome</label><input id="e-nome" value="${esc(p.nome)}" placeholder="Ex.: Pastel de Carne">
    <label>Categoria</label><select id="e-cat">${["Pastéis","Bebidas","Outros"].map(c=>`<option ${c===p.cat?"selected":""}>${c}</option>`).join("")}</select>
    <div class="row" id="e-tam"><div><label>Preço M (R$)</label><input id="e-pm" inputmode="decimal" value="${valBR(p.precoM||15)}"></div><div><label>Preço G (R$)</label><input id="e-pg" inputmode="decimal" value="${valBR(p.precoG||25)}"></div></div>
    <div id="e-uni"><label>Preço (R$)</label><input id="e-preco" inputmode="decimal" value="${valBR(p.preco)}" placeholder="0,00"></div>
    <div class="row" style="margin-top:16px">${id?'<button class="btn sec" id="e-del" style="color:var(--danger)">Excluir</button>':'<button class="btn sec" id="e-can">Cancelar</button>'}<button class="btn" id="e-ok">Salvar</button></div>
    ${id?'<button class="btn sec sm" id="e-can" style="width:100%;margin-top:8px">Cancelar</button>':""}`;
  const tg=()=>{const t=$("e-cat").value==="Pastéis";$("e-tam").classList.toggle("hidden",!t);$("e-uni").classList.toggle("hidden",t)};
  $("e-cat").onchange=tg;tg();$("modal").style.display="flex";
  $("e-can").onclick=()=>$("modal").style.display="none";
  $("e-ok").onclick=()=>{
    const nome=cap($("e-nome").value);if(!nome){toast("Digite o nome do item");return}
    const c=$("e-cat").value;
    const item=c==="Pastéis"?{nome,cat:c,precoM:numBR($("e-pm").value),precoG:numBR($("e-pg").value)}:{nome,cat:c,preco:numBR($("e-preco").value)};
    if(id){const o=db.produtos.find(x=>x.id===id);delete o.preco;delete o.precoM;delete o.precoG;Object.assign(o,item)}
    else db.produtos.push({id:uid(),ativo:true,...item});
    save();$("modal").style.display="none";toast(id?"Item salvo":"Item adicionado");renderCardapio();
  };
  if(id)$("e-del").onclick=()=>confirmar("Excluir "+p.nome+" do cardápio?",()=>{db.produtos=db.produtos.filter(x=>x.id!==id);Object.keys(carrinho).forEach(k=>{if(k.split("|")[0]===id)delete carrinho[k]});save();renderCardapio()});
}
// confirmação (sem alert/confirm)
function confirmar(msg,ok){
  $("modal-box").innerHTML=`<p style="font-size:16px;margin:4px 0 16px">${msg}</p><div class="row"><button class="btn sec" id="m-n">Voltar</button><button class="btn" id="m-s">Confirmar</button></div>`;
  $("modal").style.display="flex";$("m-n").onclick=()=>$("modal").style.display="none";$("m-s").onclick=()=>{$("modal").style.display="none";ok()};
}
aba("novo");
</script>
